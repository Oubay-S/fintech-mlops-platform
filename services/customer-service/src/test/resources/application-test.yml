spring:
  datasource:
    url: jdbc:h2:mem:customer_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS customer
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: customer
  flyway:
    enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false

app:
  jwt:
    issuer: fintech-auth-test
    audience: fintech-platform-test
  messaging:
    exchange: fintech.events
    queues:
      customer-events: customer.events

