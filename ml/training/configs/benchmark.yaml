# Phase 4 benchmark config — Role 4 (ML Training)
#
# Primary population: app-valid, in-scope (the traffic the app can actually
# create). All-types / in-scope 1M samples are secondary comparisons.
# Populations are built by `python -m ml.training.scripts.build_populations`.

seed: 42
cv:
  folds: 5
  seeds: [42, 43, 44]

populations:
  primary: app_valid
  secondary: [in_scope_sample_1m, all_types_sample_1m]
  paths:
    app_valid: ml/data/processed/populations/app_valid.parquet
    app_valid_sample_100k: ml/data/processed/populations/app_valid_sample_100k.parquet
    in_scope_sample_1m: ml/data/processed/populations/in_scope_sample_1m.parquet
    all_types_sample_1m: ml/data/processed/populations/all_types_sample_1m.parquet
    transfer_app_valid: ml/data/processed/populations/transfer_app_valid.parquet
    cash_out_app_valid: ml/data/processed/populations/cash_out_app_valid.parquet

protocols:
  # The served model. Restricted (no new-balance/equality features) and
  # rule-blind (drop sender_old_balance / evaluate on rule-negative rows) are
  # added in the next iteration; the runner accepts a `protocol` field.
  - contract

evaluation:
  rule_baseline: true
  hard_subset: true
  serving_consistent: true

models:
  lr:
    params:
      max_iter: 1000
      solver: lbfgs
      class_weight: balanced
  rf:
    params:
      n_estimators: 300
      min_samples_leaf: 2
      class_weight: balanced_subsample
      n_jobs: -1
  xgb:
    params:
      n_estimators: 300
      max_depth: 6
      learning_rate: 0.1
      subsample: 0.8
      colsample_bytree: 0.8
      tree_method: hist
      eval_metric: aucpr
      n_jobs: -1
    scale_pos_weight: auto
  svm:
    # Linear SVM + sigmoid calibration: fast and reproducible on the team's
    # laptops. RBF SVC on 50k+ x 15 fits is too slow for the benchmark.
    params:
      C: 1.0
      class_weight: balanced
      max_iter: 5000
    calibrate: true
    max_train_rows: 50000
  mlp:
    params:
      hidden_layer_sizes: [64, 32]
      activation: relu
      alpha: 0.0001
      batch_size: 512
      learning_rate_init: 0.001
      max_iter: 200
      early_stopping: true
      validation_fraction: 0.1
      n_iter_no_change: 10

output:
  results_csv: ml/training/results/benchmark_runs.csv
  report_md: ml/training/docs/benchmark_report.md
